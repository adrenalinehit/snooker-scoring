<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Snooker Scorer</title>
  <style>
    :root {
      --green: #1a5c2e;
      --dark-green: #0d3d1e;
      --light-green: #2d7a45;
      --gold: #c9a227;
      --white: #f0f0f0;
      --red-ball: #c0392b;
      --yellow-ball: #f1c40f;
      --green-ball: #27ae60;
      --brown-ball: #8B4513;
      --blue-ball: #2980b9;
      --pink-ball: #e91e8c;
      --black-ball: #1a1a2e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--dark-green);
      color: var(--white);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--dark-green);
      border-bottom: 2px solid var(--gold);
      padding: 10px 16px;
      text-align: center;
    }
    header h1 { font-size: 1.4rem; color: var(--gold); letter-spacing: 1px; }

    /* ── Scoreboard ── */
    .scoreboard {
      display: flex;
      background: var(--green);
      border-bottom: 2px solid var(--gold);
    }

    .player-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 6px;
      transition: background 0.2s;
    }
    .player-panel.active { background: var(--light-green); }

    .player-frames { font-size: 0.75rem; color: var(--gold); margin-bottom: 3px; }

    .player-name {
      font-size: 0.9rem;
      font-weight: 600;
      outline: none;
      border-bottom: 1px dashed transparent;
      text-align: center;
      min-width: 80px;
      cursor: text;
      padding: 2px 4px;
      border-radius: 3px;
    }
    .player-name:focus { border-bottom-color: var(--gold); background: rgba(255,255,255,0.05); }

    .player-score { font-size: 2.8rem; font-weight: bold; line-height: 1; margin-top: 4px; }

    .player-break { font-size: 0.8rem; color: var(--gold); margin-top: 3px; min-height: 1.2em; }

    .middle-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 10px;
      min-width: 70px;
    }
    .vs-text { font-size: 0.85rem; color: rgba(255,255,255,0.4); }
    .pts-remaining { font-size: 0.7rem; color: rgba(255,255,255,0.55); text-align: center; margin-top: 6px; line-height: 1.4; }

    /* ── Turn indicator ── */
    .turn-indicator {
      background: var(--light-green);
      padding: 8px 16px;
      text-align: center;
      font-weight: 600;
      border-bottom: 1px solid rgba(0,0,0,0.2);
    }
    .turn-phase { font-size: 0.78rem; color: var(--gold); margin-top: 2px; }

    /* ── Break ball trail ── */
    .break-display {
      padding: 8px 16px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      min-height: 44px;
      align-items: center;
    }
    .break-ball {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: bold;
      box-shadow: 1px 1px 3px rgba(0,0,0,0.5);
      flex-shrink: 0;
    }

    /* ── Ball buttons ── */
    .ball-section { padding: 8px 16px 4px; }
    .ball-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    .ball-btn {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.25);
      font-weight: bold;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 3px 3px 8px rgba(0,0,0,0.5), inset -2px -2px 6px rgba(0,0,0,0.25), inset 2px 2px 6px rgba(255,255,255,0.15);
      user-select: none;
      transition: transform 0.08s;
    }
    .ball-btn:active { transform: scale(0.9); }

    .ball-btn .bv { font-size: 1.5rem; line-height: 1; }
    .ball-btn .bn { font-size: 0.6rem; opacity: 0.9; margin-top: 1px; }

    .ball-red    { background: var(--red-ball);    color: white; }
    .ball-yellow { background: var(--yellow-ball); color: #333; }
    .ball-green  { background: var(--green-ball);  color: white; }
    .ball-brown  { background: var(--brown-ball);  color: white; }
    .ball-blue   { background: var(--blue-ball);   color: white; }
    .ball-pink   { background: var(--pink-ball);   color: white; }
    .ball-black  { background: var(--black-ball);  color: white; border-color: rgba(255,255,255,0.35); }

    /* ── Action buttons ── */
    .actions {
      padding: 10px 16px 4px;
      display: flex;
      gap: 10px;
    }
    .action-btn {
      flex: 1;
      padding: 14px 8px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.1s;
    }
    .action-btn:active { opacity: 0.7; }
    .btn-miss  { background: #6c757d; color: white; }
    .btn-foul  { background: #c0392b; color: white; }

    .secondary-actions {
      padding: 8px 16px 16px;
      display: flex;
      gap: 8px;
    }
    .secondary-btn {
      flex: 1;
      padding: 9px 6px;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 8px;
      background: transparent;
      color: var(--white);
      font-size: 0.82rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .secondary-btn:hover { background: rgba(255,255,255,0.08); }
    .secondary-btn:active { background: rgba(255,255,255,0.15); }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.72);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-overlay.hidden { display: none; }

    .modal {
      background: var(--green);
      border: 2px solid var(--gold);
      border-radius: 14px;
      padding: 24px 20px;
      width: 90%;
      max-width: 360px;
      text-align: center;
    }
    .modal h2 { color: var(--gold); margin-bottom: 14px; }
    .modal p  { margin-bottom: 14px; color: rgba(255,255,255,0.9); line-height: 1.5; }

    .modal-btns { display: flex; gap: 10px; }
    .modal-btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    .modal-btn-primary   { background: var(--gold); color: #1a1a1a; }
    .modal-btn-secondary { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.3); }

    .foul-options { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 16px; }
    .foul-opt-btn {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 50%;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.4);
    }
    .foul-opt-btn:active { transform: scale(0.9); }

    @media (max-width: 360px) {
      .ball-btn { width: 64px; height: 64px; }
      .player-score { font-size: 2.3rem; }
    }
  </style>
</head>
<body>

<header>
  <h1>🎱 Snooker Scorer</h1>
</header>

<div class="scoreboard">
  <div class="player-panel" id="p0-panel">
    <div class="player-frames" id="p0-frames">0 frames</div>
    <div class="player-name" id="p0-name" contenteditable="true" spellcheck="false">Player 1</div>
    <div class="player-score" id="p0-score">0</div>
    <div class="player-break" id="p0-break"></div>
  </div>
  <div class="middle-panel">
    <div class="vs-text">vs</div>
    <div class="pts-remaining" id="pts-remaining">147<br>pts left</div>
  </div>
  <div class="player-panel" id="p1-panel">
    <div class="player-frames" id="p1-frames">0 frames</div>
    <div class="player-name" id="p1-name" contenteditable="true" spellcheck="false">Player 2</div>
    <div class="player-score" id="p1-score">0</div>
    <div class="player-break" id="p1-break"></div>
  </div>
</div>

<div class="turn-indicator">
  <div id="turn-text">Player 1's turn to break</div>
  <div class="turn-phase" id="turn-phase">Pot a red ball</div>
</div>

<div class="break-display" id="break-display"></div>

<div class="ball-section">
  <div class="ball-grid" id="ball-grid"></div>
</div>

<div class="actions">
  <button class="action-btn btn-miss" onclick="miss()">Miss / Safe</button>
  <button class="action-btn btn-foul" onclick="showFoulDialog()">Foul</button>
</div>

<div class="secondary-actions">
  <button class="secondary-btn" onclick="undo()">↩ Undo</button>
  <button class="secondary-btn" onclick="concedeFrame()">Concede Frame</button>
  <button class="secondary-btn" onclick="newMatch()">New Match</button>
</div>

<!-- Frame Over Modal -->
<div class="modal-overlay hidden" id="frame-over-modal">
  <div class="modal">
    <h2>🏆 Frame Over</h2>
    <p id="frame-over-text"></p>
    <div class="modal-btns">
      <button class="modal-btn modal-btn-primary" onclick="startNewFrame()">Next Frame</button>
      <button class="modal-btn modal-btn-secondary" onclick="newMatch()">New Match</button>
    </div>
  </div>
</div>

<!-- Foul Modal -->
<div class="modal-overlay hidden" id="foul-modal">
  <div class="modal">
    <h2>Foul</h2>
    <p>Select the ball fouled on<br>(opponent receives at least 4 pts):</p>
    <div class="foul-options">
      <button class="foul-opt-btn ball-red"    style="color:white" onclick="applyFoul(1)">1</button>
      <button class="foul-opt-btn ball-yellow"  style="color:#333"  onclick="applyFoul(2)">2</button>
      <button class="foul-opt-btn ball-green"   style="color:white" onclick="applyFoul(3)">3</button>
      <button class="foul-opt-btn ball-brown"   style="color:white" onclick="applyFoul(4)">4</button>
      <button class="foul-opt-btn ball-blue"    style="color:white" onclick="applyFoul(5)">5</button>
      <button class="foul-opt-btn ball-pink"    style="color:white" onclick="applyFoul(6)">6</button>
      <button class="foul-opt-btn ball-black"   style="color:white" onclick="applyFoul(7)">7</button>
    </div>
    <div class="modal-btns">
      <button class="modal-btn modal-btn-secondary" onclick="hideFoulDialog()">Cancel</button>
    </div>
  </div>
</div>

<script>
  /* ─────────────────────────────────────────
     Colour definitions (Yellow → Black)
  ───────────────────────────────────────── */
  const COLORS = [
    { name: 'Yellow', value: 2, cls: 'ball-yellow' },
    { name: 'Green',  value: 3, cls: 'ball-green'  },
    { name: 'Brown',  value: 4, cls: 'ball-brown'  },
    { name: 'Blue',   value: 5, cls: 'ball-blue'   },
    { name: 'Pink',   value: 6, cls: 'ball-pink'   },
    { name: 'Black',  value: 7, cls: 'ball-black'  },
  ];

  /* ─────────────────────────────────────────
     State
  ───────────────────────────────────────── */
  let state;
  let history = [];

  function initState() {
    state = {
      scores:       [0, 0],
      frames:       [0, 0],
      currentBreak: 0,
      currentPlayer: 0,
      redsLeft:     15,
      // 'red' → pot a red
      // 'color' → pot any colour (after a red)
      // 'colors_in_order' → pot colours in sequence Yellow→Black
      // 'frame_over'
      phase:        'red',
      colorIndex:   0,       // index into COLORS for colors_in_order phase
      breakBalls:   [],      // { value, cls } for each ball in the current break
    };
    history = [];
  }

  function saveHistory() {
    history.push(JSON.parse(JSON.stringify(state)));
    if (history.length > 50) history.shift();
  }

  /* ─────────────────────────────────────────
     Helpers
  ───────────────────────────────────────── */
  function getPlayerName(i) {
    return document.getElementById(`p${i}-name`).innerText.trim() || `Player ${i + 1}`;
  }

  function calcPointsRemaining() {
    const { redsLeft, phase, colorIndex } = state;
    if (phase === 'red') {
      // redsLeft reds + redsLeft colours (max 7 each) + 6 final colours (27 pts)
      return redsLeft * 8 + 27;
    }
    if (phase === 'color') {
      // free colour (max 7) + remaining reds cycle + final 6 colours
      return 7 + redsLeft * 8 + 27;
    }
    if (phase === 'colors_in_order') {
      return COLORS.slice(colorIndex).reduce((s, c) => s + c.value, 0);
    }
    return 0;
  }

  /* ─────────────────────────────────────────
     Game actions
  ───────────────────────────────────────── */
  function potBall(value, cls) {
    if (state.phase === 'frame_over') return;
    saveHistory();

    state.scores[state.currentPlayer] += value;
    state.currentBreak += value;
    state.breakBalls.push({ value, cls });

    if (state.phase === 'red') {
      state.redsLeft--;
      state.phase = 'color';

    } else if (state.phase === 'color') {
      if (state.redsLeft > 0) {
        state.phase = 'red';
      } else {
        // Last free colour potted — move to colours in order
        state.phase = 'colors_in_order';
        state.colorIndex = 0;
      }

    } else if (state.phase === 'colors_in_order') {
      state.colorIndex++;
      if (state.colorIndex >= COLORS.length) {
        endFrame();
        return;
      }
    }

    render();
  }

  function miss() {
    if (state.phase === 'frame_over') return;
    saveHistory();
    state.currentBreak = 0;
    state.breakBalls   = [];
    state.currentPlayer = 1 - state.currentPlayer;
    render();
  }

  function showFoulDialog() {
    if (state.phase === 'frame_over') return;
    document.getElementById('foul-modal').classList.remove('hidden');
  }

  function hideFoulDialog() {
    document.getElementById('foul-modal').classList.add('hidden');
  }

  function applyFoul(ballValue) {
    hideFoulDialog();
    if (state.phase === 'frame_over') return;
    saveHistory();

    const points   = Math.max(4, ballValue);
    const opponent = 1 - state.currentPlayer;
    state.scores[opponent] += points;
    state.currentBreak  = 0;
    state.breakBalls    = [];
    state.currentPlayer = opponent;
    render();
  }

  function undo() {
    if (history.length === 0) return;
    state = history.pop();
    document.getElementById('frame-over-modal').classList.add('hidden');
    render();
  }

  function concedeFrame() {
    if (state.phase === 'frame_over') return;
    saveHistory();
    const winner = 1 - state.currentPlayer;
    state.frames[winner]++;
    state.phase = 'frame_over';
    showFrameOver(winner, true);
    render();
  }

  function endFrame() {
    // Called after all balls potted
    const winner = state.scores[0] >= state.scores[1] ? 0 : 1;
    state.frames[winner]++;
    state.phase = 'frame_over';
    showFrameOver(winner, false);
    render();
  }

  function showFrameOver(winner, conceded) {
    const winnerName = getPlayerName(winner);
    const loserName  = getPlayerName(1 - winner);
    const s0 = state.scores[0], s1 = state.scores[1];
    const text = conceded
      ? `${winnerName} wins the frame — ${loserName} conceded.\nScore: ${s0} – ${s1}`
      : `${winnerName} wins the frame!\nScore: ${s0} – ${s1}`;
    document.getElementById('frame-over-text').textContent = text;
    document.getElementById('frame-over-modal').classList.remove('hidden');
  }

  function startNewFrame() {
    document.getElementById('frame-over-modal').classList.add('hidden');
    const frames = [...state.frames];
    initState();
    state.frames = frames;
    render();
  }

  function newMatch() {
    document.getElementById('frame-over-modal').classList.add('hidden');
    initState();
    render();
  }

  /* ─────────────────────────────────────────
     Rendering
  ───────────────────────────────────────── */
  function renderBallButtons() {
    const grid = document.getElementById('ball-grid');
    grid.innerHTML = '';
    if (state.phase === 'frame_over') return;

    if (state.phase === 'red') {
      grid.appendChild(makeBallBtn(1, 'Red', 'ball-red'));

    } else if (state.phase === 'color') {
      COLORS.forEach(c => grid.appendChild(makeBallBtn(c.value, c.name, c.cls)));

    } else if (state.phase === 'colors_in_order') {
      const c = COLORS[state.colorIndex];
      if (c) grid.appendChild(makeBallBtn(c.value, c.name, c.cls));
    }
  }

  function makeBallBtn(value, name, cls) {
    const btn = document.createElement('button');
    btn.className = `ball-btn ${cls}`;
    if (cls === 'ball-yellow') btn.style.color = '#333';
    btn.innerHTML = `<span class="bv">${value}</span><span class="bn">${name}</span>`;
    btn.onclick = () => potBall(value, cls);
    return btn;
  }

  function renderBreakDisplay() {
    const display = document.getElementById('break-display');
    display.innerHTML = '';
    state.breakBalls.forEach(b => {
      const el = document.createElement('div');
      el.className = `break-ball ${b.cls}`;
      el.textContent = b.value;
      if (b.cls === 'ball-yellow') el.style.color = '#333';
      display.appendChild(el);
    });
  }

  function render() {
    for (let i = 0; i < 2; i++) {
      document.getElementById(`p${i}-score`).textContent = state.scores[i];
      document.getElementById(`p${i}-frames`).textContent =
        state.frames[i] + (state.frames[i] === 1 ? ' frame' : ' frames');

      const panel = document.getElementById(`p${i}-panel`);
      panel.classList.toggle('active',
        state.phase !== 'frame_over' && i === state.currentPlayer);

      const breakEl = document.getElementById(`p${i}-break`);
      breakEl.textContent = (i === state.currentPlayer && state.currentBreak > 0)
        ? `Break: ${state.currentBreak}`
        : '';
    }

    document.getElementById('pts-remaining').innerHTML =
      calcPointsRemaining() + '<br>pts left';

    if (state.phase !== 'frame_over') {
      const name = getPlayerName(state.currentPlayer);
      document.getElementById('turn-text').textContent = `${name}'s turn`;

      let phaseText;
      if (state.phase === 'red') {
        phaseText = `${state.redsLeft} red${state.redsLeft !== 1 ? 's' : ''} remaining — pot a red`;
      } else if (state.phase === 'color') {
        phaseText = 'Pot any colour';
      } else if (state.phase === 'colors_in_order') {
        phaseText = `Colours in order — pot ${COLORS[state.colorIndex].name}`;
      }
      document.getElementById('turn-phase').textContent = phaseText;
    }

    renderBallButtons();
    renderBreakDisplay();
  }

  /* ─────────────────────────────────────────
     Player name editing
  ───────────────────────────────────────── */
  document.querySelectorAll('.player-name').forEach(el => {
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); this.blur(); }
    });
    el.addEventListener('blur', function () {
      // Keep name non-empty
      if (!this.innerText.trim()) this.textContent = this.id === 'p0-name' ? 'Player 1' : 'Player 2';
      render();
    });
  });

  /* ─────────────────────────────────────────
     Boot
  ───────────────────────────────────────── */
  initState();
  render();
</script>
</body>
</html>
